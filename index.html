<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#073D33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Bhai Bhai Store — Sales & Inventory System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F7F5;--surface:#fff;--surface-2:#EAF3F0;--surface-3:#D9E9E3;
  --primary:#0E7C66;--primary-dark:#073D33;--primary-light:#DCEFE9;
  --accent:#FF7A33;--accent-dark:#D9601E;--accent-light:#FFE8D6;
  --success:#1E9E6B;--success-light:#DFF5EA;
  --danger:#E0393E;--danger-light:#FBE1E1;
  --warning:#C9860A;--warning-light:#FBECD2;
  --purple:#A8386B;--purple-light:#F6E2EC;
  --lemon:#F2C94C;
  --text:#0B241F;--text-2:#25453E;--muted:#5E7B74;--muted-2:#96AFA8;
  --border:#DCE7E2;--radius:16px;--radius-sm:11px;--radius-lg:22px;
  --grad:linear-gradient(135deg,var(--primary-dark),var(--primary) 65%,#129A7C);
  --grad-accent:linear-gradient(135deg,var(--accent),var(--lemon));
  --shadow-1:0 1px 2px rgba(9,38,32,.06);
  --shadow-2:0 10px 28px rgba(7,61,51,.12);
}
html,body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-bottom:78px;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
h1,h2,h3,.brandfont{font-family:'Sora','Inter',-apple-system,sans-serif}
::selection{background:var(--accent-light);color:var(--accent-dark)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

.watermark{text-align:center;font-size:10px;color:var(--muted-2);padding:22px 16px 30px;font-weight:600;border-top:1px dashed var(--border);margin-top:22px;letter-spacing:.2px}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);top:-160px;right:-140px}
.login-wrap::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,51,.18),transparent 70%);bottom:-140px;left:-100px}
.bubble{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.16);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:1}90%{opacity:.5}100%{transform:translateY(-115vh) scale(1.3);opacity:0}}
.login-card{background:#fff;padding:38px 26px 30px;border-radius:26px;width:100%;max-width:400px;box-shadow:0 30px 90px rgba(4,30,25,.45);position:relative;z-index:2;animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo{width:78px;height:78px;margin:0 auto 16px;background:var(--grad);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 12px 26px rgba(14,124,102,.4);position:relative}
.login-logo::after{content:'';position:absolute;inset:-6px;border-radius:28px;border:1.5px solid rgba(14,124,102,.25)}
.login-card h1{text-align:center;font-size:22px;margin-bottom:3px;font-weight:800;color:var(--text);letter-spacing:-.2px}
.login-card .sub{text-align:center;color:var(--accent-dark);font-size:11px;margin-bottom:26px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
.login-card label{display:block;font-size:11px;color:var(--text-2);margin-bottom:7px;font-weight:700;letter-spacing:0.3px}
.login-card select,.login-card input{width:100%;padding:13px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-weight:500;transition:all 0.15s}
.login-card select:focus,.login-card input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light)}
.login-card .field{margin-bottom:15px}
.btn{width:100%;padding:14px;border-radius:13px;background:var(--grad);color:#fff;font-size:14px;font-weight:800;font-family:'Sora',sans-serif;box-shadow:0 10px 24px rgba(14,124,102,.35);transition:transform .15s,box-shadow .15s;margin-top:6px;letter-spacing:.2px}
.btn:active{transform:scale(0.98);box-shadow:0 4px 14px rgba(14,124,102,.35)}

/* ===== BUTTONS ===== */
.btn-sm{padding:10px 14px;border-radius:11px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;font-family:'Sora',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform .12s}
.btn-sm:active{transform:scale(0.96)}
.btn-sm.green{background:var(--success)}
.btn-sm.red{background:var(--danger)}
.btn-sm.orange{background:var(--warning)}
.btn-sm.purple{background:var(--purple)}
.btn-sm.gray{background:var(--muted)}
.btn-block{width:100%;padding:12px}
.btn-row{display:flex;gap:8px;margin-top:12px}

/* ===== HEADER / NAV ===== */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:11px;min-width:0}
.header-logo{width:40px;height:40px;background:var(--grad);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 6px 14px rgba(14,124,102,.3)}
.header-title{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:var(--text);line-height:1.2;letter-spacing:-.1px}
.header-sub{font-size:9.5px;color:var(--accent-dark);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.header-right{display:flex;gap:6px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-2);transition:transform .15s}
.icon-btn:active{background:var(--surface-3);transform:scale(.94)}
.icon-btn.spin-once{animation:spinOnce .6s ease}
@keyframes spinOnce{to{transform:rotate(360deg)}}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--surface-2);padding:5px 10px 5px 5px;border-radius:20px;font-size:11px;border:1px solid var(--border);font-weight:700;color:var(--text-2);max-width:120px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.user-avatar.role-so{background:linear-gradient(135deg,var(--accent-dark),var(--accent))}
.user-avatar.role-guest{background:linear-gradient(135deg,var(--purple),#c95a90)}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:63px;z-index:99}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;font-family:'Sora',sans-serif;white-space:nowrap;transition:all 0.15s}
.tab-btn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(14,124,102,.3)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 2px 8px;z-index:99}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;color:var(--muted);font-size:9px;font-weight:700;cursor:pointer;border-radius:8px;min-width:0}
.nav-item.active{color:var(--primary)}
.nav-item .ico{font-size:17px;line-height:1;transition:transform 0.2s}
.nav-item.active .ico{transform:scale(1.18) translateY(-1px)}
.nav-item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ===== LAYOUT / CARDS ===== */
.container{padding:14px 14px 20px}
.card{background:var(--surface);border-radius:var(--radius);padding:15px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow-1)}
.card-title{font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.1px}
.card-title .badge{font-size:9px;padding:3px 9px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);font-weight:800}
.card-title .badge.green{background:var(--success-light);color:var(--success)}
.card-title .badge.orange{background:var(--warning-light);color:var(--warning)}
.card-title .badge.purple{background:var(--purple-light);color:var(--purple)}

/* ===== KPI TILES ===== */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-grid.three{grid-template-columns:1fr 1fr 1fr}
.kpi{background:var(--surface);border-radius:var(--radius);padding:13px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .15s}
.kpi::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
.kpi.blue::before{background:var(--primary)}
.kpi.green::before{background:var(--success)}
.kpi.orange::before{background:var(--accent)}
.kpi.red::before{background:var(--danger)}
.kpi.purple::before{background:var(--purple)}
.kpi-icon{font-size:14px;opacity:.8;display:inline-block;margin-bottom:4px}
.kpi-label{font-size:9px;color:var(--muted);letter-spacing:.4px;margin-bottom:5px;font-weight:800}
.kpi-value{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;color:var(--text);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:4px;font-weight:600}
.kpi.blue .kpi-value{color:var(--primary)}
.kpi.green .kpi-value{color:var(--success)}
.kpi.orange .kpi-value{color:var(--accent-dark)}
.kpi.red .kpi-value{color:var(--danger)}
.kpi.purple .kpi-value{color:var(--purple)}
.kpi.celebrate{animation:pulseGlow 1.4s ease 2}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(255,122,51,0)}50%{box-shadow:0 0 0 6px rgba(255,122,51,.15)}}

/* ===== FORMS / TABLES ===== */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:10px;color:var(--text-2);margin-bottom:5px;font-weight:700;letter-spacing:0.3px}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:500;transition:all 0.15s}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);background:#fff}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--surface-2);padding:9px 8px;text-align:left;font-weight:800;color:var(--text-2);font-size:9px;white-space:nowrap;letter-spacing:.3px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-top:1px solid var(--border);white-space:nowrap;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:#F8FBFA}
.chart-box{position:relative;height:220px;margin-top:6px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:background .15s}
.list-item.me{border-color:var(--primary);background:var(--primary-light)}
.list-item-name{font-size:13px;font-weight:700;color:var(--text)}
.list-item-sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500}
.list-item-actions{display:flex;gap:6px}
.mini-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface-3)}
.mini-btn.del{background:var(--danger-light);color:var(--danger)}
.mini-btn:active{transform:scale(0.92)}

/* ===== MODAL / TOAST / LOADER ===== */
.modal-bg{position:fixed;inset:0;background:rgba(6,28,23,.55);backdrop-filter:blur(2px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;animation:cardIn .25s ease}
.modal h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;margin-bottom:16px;color:var(--text)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:12px 20px;border-radius:14px;font-size:12px;font-weight:700;z-index:999;opacity:0;transition:all 0.3s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--danger)}
.loader{position:fixed;inset:0;z-index:9999;background:rgba(242,247,245,0.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loader.show{display:flex}
.loader p{color:var(--text-2);font-weight:700;font-size:12px}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.section{display:none}
.section.active{display:block}
.section.active .card,.section.active .kpi{animation:fadeIn .35s ease backwards}
.section.active .kpi-grid .kpi:nth-child(1){animation-delay:.02s}
.section.active .kpi-grid .kpi:nth-child(2){animation-delay:.06s}
.section.active .kpi-grid .kpi:nth-child(3){animation-delay:.1s}
.section.active .card:nth-of-type(1){animation-delay:.05s}
.section.active .card:nth-of-type(2){animation-delay:.09s}
.section.active .card:nth-of-type(3){animation-delay:.13s}
.section.active .card:nth-of-type(4){animation-delay:.17s}
.search-box{position:relative;margin-bottom:10px}
.search-box input{padding-left:34px}
.search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:0.6}
.progress{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;margin-top:6px;position:relative}
.progress-bar{height:100%;background:var(--grad-accent);border-radius:5px;transition:width 0.6s cubic-bezier(.2,.8,.2,1);position:relative}
.progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 2.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rank-badge{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.rank-badge.gold{background:linear-gradient(135deg,#F2C94C,#E0A82E);color:#fff}
.rank-badge.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rank-badge.bronze{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.rank-badge.normal{background:var(--surface-3);color:var(--muted)}
.filter-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding:2px 0}
.filter-chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .15s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{text-align:center;padding:36px 14px;color:var(--muted);font-size:12px;font-weight:600}
.empty .icon{font-size:36px;margin-bottom:8px;opacity:0.6}
.info-banner{background:var(--grad);color:#fff;padding:18px;border-radius:var(--radius);margin-bottom:12px;position:relative;overflow:hidden}
.info-banner::after{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,51,.25),transparent 70%);top:-60px;right:-50px}
.info-banner h2{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;margin-bottom:3px;position:relative;z-index:2;letter-spacing:-.1px}
.info-banner p{font-size:10.5px;opacity:0.85;font-weight:600;position:relative;z-index:2}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="spinner"></div><p>লোড হচ্ছে...</p></div>

<div id="loginScreen" class="login-wrap">
  <div class="bubble" style="width:14px;height:14px;left:12%;animation-duration:7s;animation-delay:0s"></div>
  <div class="bubble" style="width:9px;height:9px;left:24%;animation-duration:9s;animation-delay:1.2s"></div>
  <div class="bubble" style="width:18px;height:18px;left:38%;animation-duration:8s;animation-delay:2.4s"></div>
  <div class="bubble" style="width:11px;height:11px;left:58%;animation-duration:6.5s;animation-delay:.6s"></div>
  <div class="bubble" style="width:15px;height:15px;left:72%;animation-duration:10s;animation-delay:3s"></div>
  <div class="bubble" style="width:8px;height:8px;left:85%;animation-duration:7.5s;animation-delay:1.8s"></div>
  <div class="bubble" style="width:12px;height:12px;left:94%;animation-duration:9.5s;animation-delay:.3s"></div>
  <div class="login-card">
    <div class="login-logo">🏪</div>
    <h1>Bhai Bhai Store</h1>
    <div class="sub">সেলস ও ইনভেন্টরি সিস্টেম</div>
    <div class="field">
      <label>ইউজার সিলেক্ট করুন</label>
      <select id="loginUser"></select>
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="loginPin" placeholder="পাসওয়ার্ড দিন" inputmode="numeric">
    </div>
    <button class="btn" onclick="doLogin()">সাইন ইন →</button>
    <p style="text-align:center;font-size:10px;color:var(--muted);margin-top:20px">©2026-27. Developed by Maruf@Hossain</p>
  </div>
</div>

<div id="appScreen" style="display:none">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">🏪</div>
      <div>
        <div class="header-title">Bhai Bhai Store</div>
        <div class="header-sub" id="hdrSub">v8 PRO</div>
      </div>
    </div>
    <div class="header-right">
      <div class="icon-btn" onclick="loadFromSheet()">🔄</div>
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>
        <span id="userName">Admin</span>
      </div>
      <div class="icon-btn" onclick="doLogout()">⏻</div>
    </div>
  </div>

  <div class="tab-nav" id="tabNav"></div>

  <div class="container">
    <div id="sec-dashboard" class="section active">
      <div class="info-banner"><h2 id="dashGreeting">স্বাগতম, Admin</h2><p><span id="dashMonth"></span> মাসের ব্যবসায়িক ওভারভিউ</p></div>
      <div class="form-row" style="margin-bottom:12px">
        <div class="form-group" style="margin-bottom:0"><label>মাস</label><select id="dashMonthSel" onchange="renderDashboard()"></select></div>
        <div class="form-group" style="margin-bottom:0"><label>বছর</label><select id="dashYearSel" onchange="renderDashboard()"></select></div>
      </div>
      <div class="kpi
